<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c0000"/>
      <stop offset="0.5" stop-color="#3a0000"/>
      <stop offset="1" stop-color="#160000"/>
    </linearGradient>
    <radialGradient id="light" cx="0.75" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#FFF6C2" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#F9DF32" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#160000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="facet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#F9DF32" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#91640F"/>
      <stop offset="0.5" stop-color="#F9DF32"/>
      <stop offset="1" stop-color="#B3871C"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect width="1600" height="700" fill="url(#bg)"/>
  <rect width="1600" height="700" fill="url(#light)"/>

  <g fill="#F9DF32" opacity="0.14" filter="url(#blur)">
    <circle cx="1050" cy="560" r="80"/>
    <circle cx="1480" cy="140" r="90"/>
  </g>

  <!-- large diamond -->
  <g transform="translate(1200 330)">
    <path d="M-170 -60 L-90 -150 H90 L170 -60 L0 180 Z" fill="url(#facet)" stroke="#FFF6C2" stroke-width="2"/>
    <path d="M-170 -60 H170 M-90 -150 L-50 -60 L0 180 M90 -150 L50 -60 L0 180 M-50 -60 L0 -150 L50 -60 M-170 -60 L-50 -60 M170 -60 L50 -60 M-120 -60 L0 180 M120 -60 L0 180" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.65"/>
    <path d="M-90 -150 L-50 -60 L0 -150 Z" fill="#FFFFFF" opacity="0.28"/>
    <path d="M50 -60 L170 -60 L0 180 Z" fill="#F9DF32" opacity="0.12"/>
  </g>

  <!-- ring band -->
  <g transform="translate(1440 520)">
    <ellipse cx="0" cy="0" rx="95" ry="58" fill="none" stroke="url(#gold)" stroke-width="14"/>
    <ellipse cx="0" cy="-3" rx="88" ry="52" fill="none" stroke="#FFF3B0" stroke-width="1.5" opacity="0.5"/>
    <path d="M-18 -70 L0 -92 L18 -70 L0 -50 Z" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- small diamonds -->
  <g stroke="#FFF6C2" stroke-width="1" fill="url(#facet)">
    <path d="M900 180 l14 -16 h28 l14 16 -28 40z"/>
    <path d="M1010 120 l10 -12 h20 l10 12 -20 30z"/>
  </g>

  <g fill="#FFFFFF">
    <path d="M1330 110 l4 14 14 4 -14 4 -4 14 -4 -14 -14 -4 14 -4z" opacity="0.9"/>
    <path d="M980 420 l3 10 10 3 -10 3 -3 10 -3 -10 -10 -3 10 -3z" opacity="0.7"/>
    <path d="M1520 380 l2 8 8 2 -8 2 -2 8 -2 -8 -8 -2 8 -2z" opacity="0.8"/>
  </g>
</svg>
