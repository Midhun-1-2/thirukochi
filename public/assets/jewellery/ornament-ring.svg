<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#91640F"/>
      <stop offset="0.35" stop-color="#F9DF32"/>
      <stop offset="0.5" stop-color="#FFF3B0"/>
      <stop offset="0.7" stop-color="#E3C33A"/>
      <stop offset="1" stop-color="#7a5410"/>
    </linearGradient>
    <linearGradient id="inner" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#91640F"/>
      <stop offset="0.5" stop-color="#D9B32A"/>
      <stop offset="1" stop-color="#5a3d08"/>
    </linearGradient>
    <linearGradient id="facet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#F9DF32" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F9DF32" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F9DF32" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <circle cx="300" cy="330" r="230" fill="url(#glow)" filter="url(#blur)"/>

  <!-- ring band (tilted) -->
  <g transform="translate(300 340) rotate(-18)">
    <ellipse cx="0" cy="0" rx="170" ry="120" fill="none" stroke="url(#band)" stroke-width="34"/>
    <ellipse cx="0" cy="0" rx="170" ry="120" fill="none" stroke="url(#inner)" stroke-width="10" opacity="0.55"/>
    <ellipse cx="0" cy="-2" rx="164" ry="114" fill="none" stroke="#FFF6C2" stroke-width="1.5" opacity="0.55"/>
    <ellipse cx="0" cy="0" rx="150" ry="102" fill="none" stroke="#5a3d08" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- setting + diamond -->
  <g transform="translate(300 180)">
    <path d="M-30 40 L30 40 L18 62 L-18 62 Z" fill="url(#band)"/>
    <path d="M-46 8 L-30 40 M46 8 L30 40 M0 -40 L-14 -10 M0 -40 L14 -10" stroke="url(#band)" stroke-width="5" stroke-linecap="round"/>
    <path d="M-60 10 L-32 -30 H32 L60 10 L0 80 Z" fill="url(#facet)" stroke="#FFF6C2" stroke-width="2"/>
    <path d="M-60 10 H60 M-32 -30 L-18 10 L0 80 M32 -30 L18 10 L0 80 M-18 10 L0 -30 L18 10 M-40 10 L0 80 M40 10 L0 80" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.7"/>
    <path d="M-32 -30 L-18 10 L0 -30 Z" fill="#FFFFFF" opacity="0.4"/>
  </g>

  <!-- sparkles -->
  <g fill="#FFF6C2">
    <path d="M380 120 l4 14 14 4 -14 4 -4 14 -4 -14 -14 -4 14 -4z"/>
    <path d="M150 260 l3 10 10 3 -10 3 -3 10 -3 -10 -10 -3 10 -3z"/>
    <path d="M470 400 l2 8 8 2 -8 2 -2 8 -2 -8 -8 -2 8 -2z"/>
  </g>
</svg>
